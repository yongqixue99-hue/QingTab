name: Signed QingTab Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build, for example v0.2.6
        required: true
        type: string
      create_draft_release:
        description: Create a GitHub draft Release after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: code-signing

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.release_tag }}
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'
          } else {
            '${{ inputs.release_tag }}'
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must look like v0.2.6; received $tag"
          }
          [xml]$project = Get-Content .\QingTab\QingTab.csproj -Raw -Encoding UTF8
          $declared = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($declared -ne $Matches.version) {
            throw "Tag version $($Matches.version) does not match project version $declared."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.x

      - name: Materialize the protected signing certificate
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.QINGTAB_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'The QINGTAB_SIGNING_CERTIFICATE_BASE64 repository secret is not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'qingtab-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "QINGTAB_SIGNING_CERTIFICATE_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, run all gates, sign, timestamp, package, hash, and report
        shell: powershell
        env:
          QINGTAB_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.QINGTAB_SIGNING_CERTIFICATE_PASSWORD }}
          QINGTAB_EXPECTED_SIGNER_SUBJECT: ${{ vars.QINGTAB_EXPECTED_SIGNER_SUBJECT }}
          QINGTAB_EXPECTED_SIGNER_THUMBPRINT: ${{ vars.QINGTAB_EXPECTED_SIGNER_THUMBPRINT }}
          QINGTAB_TIMESTAMP_URL: ${{ vars.QINGTAB_TIMESTAMP_URL }}
        run: |
          .\build-release.ps1 `
            -Version '${{ steps.meta.outputs.version }}' `
            -OutputRoot .\release-output `
            -Sign

      - name: Remove protected certificate material
        if: always()
        shell: powershell
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'qingtab-signing.pfx'
          if (Test-Path -LiteralPath $pfxPath) {
            Remove-Item -LiteralPath $pfxPath -Force
          }

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QingTab-v${{ steps.meta.outputs.version }}-signed-release
          path: |
            release-output/QingTab-v${{ steps.meta.outputs.version }}-portable.zip
            release-output/QingTab-v${{ steps.meta.outputs.version }}-portable.zip.sha256
            release-output/QingTab-v${{ steps.meta.outputs.version }}-source.zip
            release-output/QingTab-v${{ steps.meta.outputs.version }}-source.zip.sha256
            release-output/QingTab-v${{ steps.meta.outputs.version }}-RELEASE-REPORT.md
            release-output/QingTab-v${{ steps.meta.outputs.version }}-release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release
        if: github.event_name == 'push' || inputs.create_draft_release == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite it."
          }
          $version = '${{ steps.meta.outputs.version }}'
          $report = ".\release-output\QingTab-v$version-RELEASE-REPORT.md"
          $assets = @(
            ".\release-output\QingTab-v$version-portable.zip",
            ".\release-output\QingTab-v$version-portable.zip.sha256",
            ".\release-output\QingTab-v$version-source.zip",
            ".\release-output\QingTab-v$version-source.zip.sha256",
            $report,
            ".\release-output\QingTab-v$version-release-manifest.json"
          )
          gh release create $tag @assets `
            --verify-tag `
            --draft `
            --title "QingTab $tag Lite" `
            --notes-file $report
          if ($LASTEXITCODE -ne 0) { throw 'Draft GitHub Release creation failed.' }
